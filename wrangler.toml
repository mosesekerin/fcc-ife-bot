# FCC Ife Bot — Cloudflare Worker config
# The Worker's address (https://fcc-ife-bot.<your-subdomain>.workers.dev) is printed
# on every sticker QR. Never rename `name` after stickers are printed.

name = "fcc-ife-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

# Images for messages and link previews: files in ./public are served at the same address,
# e.g. public/img/welcome.jpg -> https://<worker>.workers.dev/img/welcome.jpg
[assets]
directory = "./public"

# Follow-ups are sent by this cron, every minute
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "fcc-ife-bot"
database_id = "set-by-deploy-workflow"  # the deploy workflow finds (or creates) the database and fills this in

# Secrets are NOT here. Set them with:
# They live in GitHub (repo Settings > Secrets > Actions) and the deploy workflow copies
# them into Cloudflare: VERIFY_TOKEN, APP_SECRET, ACCESS_TOKEN, ADMIN_NUMBERS.

[vars]
PHONE_NUMBER_ID = "1356832454189968"   # Meta > WhatsApp > API Setup (under "From")
GRAPH_VERSION   = "v23.0"

# Numbers in international format, no + or spaces
ANSWERS_LINE_NUMBER = "15551399198"      # the bot's number (Meta test number for now, real SIM later)
MAIN_LINE_NUMBER    = "2348118466251"    # church phone on WhatsApp Business app
MAIN_LINE_DISPLAY   = "0811 846 6251"    # how people should save it
PRIVACY_CONTACT     = "fullnessife@gmail.com"  # shown on /privacy

ANSWERS_LINK = "https://pleros.org/purpose"
CHANNEL_LINK = ""   # the channel invitation is added to the follow-up once this is set

FOLLOWUP_DELAY_SECONDS = 300   # 5 min: enough to watch the film and episode 1
HANDOFF_COOLDOWN_HOURS = 12

# Location tags (tag = place). Never rename a tag after its stickers are printed.
TAGS = { ANG = "Angola Hall", MOZ = "Mozambique Hall" }
# Later: ETF = "ETF Hall", AWL = "Awolowo Hall", FAJ = "Fajuyi Hall", AKT = "Akintola Hall", ALM = "Alumni Hall"

# ---- Video and pictures ------------------------------------------------------------
# Full https URLs. Leave "" to skip. Video: MP4 (H.264 + AAC), max 16 MB. Pictures: JPG/PNG, max 5 MB.
# The message text becomes the caption (max 1024 characters). Change ?v= when replacing a file.
WELCOME_VIDEO  = "https://fcc-ife-bot.fullnessife.workers.dev/video/welcome.mp4?v=1"
WELCOME_IMAGE  = "https://fcc-ife-bot.fullnessife.workers.dev/img/welcome.jpg?v=2"
FOLLOWUP_IMAGE = "https://fcc-ife-bot.fullnessife.workers.dev/img/followup.jpg?v=2"

# Preview card shown when a sticker link (/go/...) is shared in a chat
SHARE_IMAGE       = "https://fcc-ife-bot.fullnessife.workers.dev/img/share.jpg"
SHARE_TITLE       = "Ever wondered why you exist?"
SHARE_DESCRIPTION = "Find answers with Fullness of Christ Church, Ile-Ife."

# Optional: a different answer link for a tag (future question campaigns)
ANSWERS_LINKS = {}

# ---- Messages ----------------------------------------------------------------
PREFILLED_MESSAGE = 'Hi Fullness of Christ Church, I saw the question "Ever wondered why you exist?" and I would like to find the answer. (ref {tag})'

HELLO_MESSAGE = "I just started the purpose series and I'd like to talk (ref {tag})"

WELCOME_MESSAGE = '''
Welcome to Fullness of Christ Church, Ile-Ife.

Family, friends, feelings, the world: everyone has a route for you. But you didn't scan that sticker by accident. Somewhere in you, the real question is already alive.

The One who made the road has not hidden where it leads. Start the series here, 7 short episodes of about 2 minutes each:
{link}

Take your time with episode 1. We'll check on you shortly.
'''

FOLLOWUP_MESSAGE = '''
How did episode 1 sit with you?

Questions like this aren't meant to be carried alone. Some people finish it at peace, some with more questions, some unsettled. All of that is welcome.

If something stirred in you, there's a real person on our team who would love to hear it. Just a conversation:
{main_link}
'''

# Added to the follow-up only when CHANNEL_LINK is set
FOLLOWUP_CHANNEL_BLOCK = '''
And if you'd like to keep asking: our channel is for the questions most people are too busy, or too afraid, to ask. Every truth you'll ever find starts with one.
{channel_link}
'''

HANDOFF_MESSAGE = '''
This line only shares the series. For a real conversation, our team is here:
{main_link}
'''
