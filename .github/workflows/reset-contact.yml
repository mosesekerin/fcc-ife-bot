name: Reset a test contact

# Lets a number go through the full flow again (film, follow-up) as if it were new.
on:
  workflow_dispatch:
    inputs:
      number:
        description: "WhatsApp number in international format, no + (e.g. 2348133732181)"
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUMBER: ${{ inputs.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find the database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "fcc-ife-bot") | .uuid')
          test -n "$id" || { echo "::error::Database fcc-ife-bot not found"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Delete the contact and any pending follow-up
        run: |
          case "$NUMBER" in (*[!0-9]*|"") echo "::error::Digits only, e.g. 2348133732181"; exit 1;; esac
          npx wrangler d1 execute fcc-ife-bot --remote --yes \
            --command="DELETE FROM followups WHERE wa_id='$NUMBER'; DELETE FROM contacts WHERE wa_id='$NUMBER';"
          echo "Reset $NUMBER. Scan the sticker link again to restart the flow."
